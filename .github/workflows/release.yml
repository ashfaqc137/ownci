# Publish a GitHub release when a version tag is pushed:
#   git tag -a v0.1.0 -m "OwnCI v0.1.0" && git push origin v0.1.0
# Builds with tools/release.sh (make release), attests the archives and attaches
# them, SHA256SUMS and install.sh to the release. See docs/releasing.md.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # build provenance
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Preflight
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$TAG is not on main"; exit 1; }
          test -f "docs/release-notes/$TAG.md" ||
            { echo "::error::docs/release-notes/$TAG.md is missing"; exit 1; }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check
        run: make check

      - name: Build
        run: |
          make release VERSION="$TAG"
          (cd dist && sha256sum -c SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" dist/* install.sh \
            --verify-tag $prerelease \
            --title "OwnCI $TAG" \
            --notes-file "docs/release-notes/$TAG.md"
